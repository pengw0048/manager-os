<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager OS Mock</title>
<style>
:root{
  --bg:#fafafa; --panel:#fff; --line:#ececec; --text:#1f2328; --muted:#7a7f87; --hover:#f3f3f4;
  --accent:#3b5bdb; --sel:#eef2ff;
  --P0:#d6336c; --P1:#e8890c; --P2:#4c6ef5; --P3:#adb5bd;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141518; --panel:#1b1c20; --line:#2a2c31; --text:#e4e5e7; --muted:#8d929a; --hover:#23252a;
    --accent:#8ea2ff; --sel:#252a40; --P3:#6c727a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:650}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.lang button{border:0;background:none;padding:4px 10px;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--sel);color:var(--accent);font-weight:600}
.layout{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 52px)}
.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-head{padding:12px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.side-head select,.side-head input{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--panel)}
.side-head input{flex:1;min-width:0}
.list{overflow:auto;flex:1}
.li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:start;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.li:hover{background:var(--hover)}
.li.sel{background:var(--sel)}
.li.child{padding-left:34px}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px}
.li .t{font-weight:550;overflow:hidden;text-overflow:ellipsis}
.li.child .t{font-weight:450}
.li .m{color:var(--muted);font-size:12px}
.li .r{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.li .r.hot{color:var(--P0)}
.sorthdr{padding:8px 14px;font-size:12px;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.pane{overflow:auto;padding:24px 32px 60px}
.wrap{max-width:820px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:4px;cursor:pointer}
h1{font-size:21px;margin:0 0 14px;font-weight:650;display:flex;gap:10px;align-items:flex-start}
h1 .grow{outline:none}
.props{display:grid;grid-template-columns:repeat(4,auto);gap:4px 28px;justify-content:start;align-items:center;font-size:13px;margin-bottom:6px}
.props .k{color:var(--muted);font-size:12px}
.props select,.props input{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--panel)}
.urg{display:inline-flex;gap:2px;align-items:center}
.urg button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:650;cursor:pointer;color:var(--muted)}
.urg button.on{color:#fff}
.mode{font-size:12px;color:var(--muted);margin-left:6px}
.mode a{color:var(--accent);cursor:pointer}
.reason{font-size:12px;color:var(--muted);margin:2px 0 18px}
.reason .ai{color:var(--accent)}
.subs{margin:0 0 18px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.subs .row{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:7px 12px;border-top:1px solid var(--line);cursor:pointer;font-size:13px}
.subs .row:first-child{border-top:0}
.subs .row:hover{background:var(--hover)}
.subs .dot{margin-top:0}
.subs .add{color:var(--muted)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:8px 0;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--text);font-weight:600}
.brief h4{font-size:12px;color:var(--muted);font-weight:600;margin:16px 0 4px}
.brief h4:first-child{margin-top:0}
.brief p{margin:0}
.brief ul{margin:0;padding-left:18px}
.draft{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);white-space:pre-wrap}
.writing{color:var(--muted);display:flex;gap:8px;align-items:center}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.ask{display:flex;gap:8px;margin-top:22px}
.ask input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.ctx{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ic{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);background:var(--panel)}
.ctx .t{font-weight:550}
.ctx .t a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)}
.ctx .s{font-size:13px;color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:12px;text-align:center;color:var(--muted);font-size:13px;margin-top:14px}
.tl{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.tl .w{color:var(--muted)}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:34px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.08);min-width:180px;padding:4px;display:none;z-index:5}
.menu .pop.show{display:block}
.menu .pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer}
.menu .pop button:hover{background:var(--hover)}
/* sort */
.seg{display:grid;grid-template-columns:1fr 240px;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.seg .q{font-size:12px;color:var(--muted)}
.seg select{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--panel);width:100%}
/* settings */
.settings{max-width:980px;margin:0 auto;padding:24px 32px 60px;overflow:auto;height:calc(100vh - 52px)}
.settings h2{font-size:15px;margin:28px 0 4px}
.settings .d{color:var(--muted);font-size:13px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
th,td{text-align:left;padding:7px 10px;border-top:1px solid var(--line)}
th{color:var(--muted);font-weight:600;border-top:0;font-size:12px}
td input,td select{border:1px solid transparent;background:none;padding:3px 4px;border-radius:5px;width:100%}
td input:hover,td select:hover,td input:focus{border-color:var(--line)}
td input.n{width:56px}
.perm{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:13px;background:var(--panel)}
.perm:first-child{border-top:0}
.perm code{font-size:12px;color:var(--muted)}
.box{border:1px solid var(--line);border-radius:9px;overflow:hidden}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,17,22,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.show{display:flex}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px}
.dialog h2{margin:0 0 12px;font-size:16px}
.dialog label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.dialog input,.dialog textarea,.dialog select{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--panel)}
.dialog textarea{min-height:80px}
.dialog .chk{display:grid;grid-template-columns:20px 1fr;gap:6px;padding:5px 0;font-size:13px}
.dialog .chk input{width:auto}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.empty{color:var(--muted);padding:60px 0;text-align:center}
.btn.sm{padding:2px 8px;font-size:12px}
.ent{display:grid;grid-template-columns:14px 44px 1fr auto;gap:8px;align-items:start;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px}
.ent.exp{cursor:pointer}
.ent.exp:hover{background:var(--hover)}
.ent .chev{color:var(--muted);font-size:11px;padding-top:2px}
.ent .w{color:var(--muted)}
.ent .ic{width:30px;height:30px}
.ent .t{font-weight:550}
.ent .s{color:var(--muted)}
.ent .src{font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.op{color:var(--accent);cursor:pointer;font-size:12px;white-space:nowrap}
.raw{margin-top:8px;border-left:2px solid var(--line);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:6px;cursor:auto}
.raw .w{font-size:11px}
.raw.mono{font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--muted);display:block}
.cstream{display:flex;flex-direction:column;gap:10px}
.run{border:1px dashed var(--line);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.run .rh{display:flex;gap:6px;align-items:center}
.run .w{font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:9px;font-size:13px;max-width:min(560px,90vw);z-index:20;display:none;word-break:break-all}
.toast code{opacity:.8}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:8px 0}
.tile{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.tile .s{font-size:11px;color:var(--muted)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{text-align:right}
.pill{font-size:11px;border-radius:10px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.run{border-color:var(--accent);color:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ailine{font-size:12px;color:var(--muted);margin:-8px 0 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ailine a{color:var(--accent);cursor:pointer}
pre.jsonl{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;max-height:50vh;overflow:auto}
@media (max-width:860px){.tiles{grid-template-columns:1fr 1fr}}
.btn.ghost.on{background:var(--sel);color:var(--accent)}
.kbd{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px}
/* knowledge */
.knowledge{display:grid;grid-template-columns:230px 1fr 310px;height:calc(100vh - 52px)}
.kfiles{border-right:1px solid var(--line);background:var(--panel);overflow:auto}
.kfile{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.kfile:hover{background:var(--hover)} .kfile.sel{background:var(--sel)}
.kfile .t{font-size:13px;font-weight:550;word-break:break-all}
.kfile .m{font-size:12px;color:var(--muted)}
.kfile .m.old{color:var(--P1)}
.keditor{display:flex;flex-direction:column;padding:16px 20px;min-width:0;gap:8px}
.keditor textarea{flex:1;width:100%;min-height:300px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel);font:13px/1.6 ui-monospace,Menlo,monospace;resize:none}
.khelp{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
.khelp h3{font-size:13px;margin:4px 0 8px}
.khelp .hb{width:100%;text-align:left;margin-bottom:6px}
.khelp .d{font-size:12px;color:var(--muted);margin:-2px 0 10px}
.kitem{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;font-size:13px}
.kitem .src{font-size:11px;color:var(--muted);margin-top:3px}
.kitem code{font-size:12px;white-space:pre-wrap}
.kitem .acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.kitem.done{opacity:.5}
.hr{border-top:1px solid var(--line);margin:16px 0 12px}
/* assistant */
.drawer{position:fixed;top:52px;right:0;bottom:0;width:400px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.06);display:none;flex-direction:column;z-index:8}
.drawer.show{display:flex}
.dhead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.dctx{font-size:12px;color:var(--muted);padding:6px 14px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:8px 11px;border-radius:10px;font-size:13px}
.msg.u{align-self:flex-end;background:var(--sel)}
.msg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg .v{font-size:11px;color:var(--muted)}
.msg ul{margin:4px 0;padding-left:18px}
.msg a{color:var(--accent);cursor:pointer}
.acard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;background:var(--panel)}
.acard .acts{display:flex;gap:6px;margin-top:6px;align-items:center}
.dinput{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line);align-items:center}
.dinput input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.mic{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center}
.mic.on{background:var(--P0);border-color:var(--P0);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--P0) 25%,transparent)}}
@media (min-width:861px){body.dopen .layout,body.dopen .knowledge,body.dopen .settings{margin-right:400px}}
@media (max-width:860px){
  .knowledge{grid-template-columns:1fr;height:auto}
  .khelp,.kfiles{border:0;border-top:1px solid var(--line)}
  .layout{grid-template-columns:1fr;height:auto}
  .side{max-height:45vh;border-right:0;border-bottom:1px solid var(--line)}
  .pane,.settings{padding:16px}
  .props{grid-template-columns:auto 1fr}
  .seg{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="top">
  <span class="brand">Manager OS</span>
  <button class="btn ghost on" data-page="topics" data-i="topics"></button>
  <button class="btn ghost" data-page="knowledge" data-i="knowledge"></button>
  <button class="btn ghost" data-page="activity" data-i="activity"></button>
  <span class="grow"></span>
  <button class="btn" id="asstBtn">🎙 <span data-i="assistant"></span><span class="kbd">⌘K</span></button>
  <button class="btn primary" id="newBtn" data-i="newTopic"></button>
  <div class="lang"><button data-lang="en" class="on">EN</button><button data-lang="zh">中文</button></div>
  <button class="btn ghost" id="setBtn" data-i="settings"></button>
</div>

<div class="layout" id="main">
  <aside class="side">
    <div class="side-head">
      <select id="view"></select>
      <input id="q" data-ip="search">
    </div>
    <div class="list" id="list"></div>
  </aside>
  <section class="pane"><div class="wrap" id="pane"></div></section>
</div>

<div class="settings" id="settings" style="display:none"></div>

<div class="settings" id="activity" style="display:none"></div>

<div class="knowledge" id="knowledge" style="display:none">
  <div class="kfiles" id="kfiles"></div>
  <div class="keditor" id="keditor"></div>
  <div class="khelp" id="khelp"></div>
</div>

<div class="drawer" id="drawer">
  <div class="dhead"><b data-i="assistant"></b><span class="grow"></span><button class="btn ghost sm" id="dClose">✕</button></div>
  <div class="dctx" id="dctx"></div>
  <div class="msgs" id="msgs"></div>
  <div class="dinput"><button class="mic" id="mic" title="Voice">🎙</button><input id="dIn"><button class="btn primary" id="dSend" data-i="send"></button></div>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>

<script>
const T=(en,zh)=>({en,zh});
let lang='en';
const tr=o=>o==null?'':typeof o==='string'?o:(o[lang]??o.en);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORS={P0:'var(--P0)',P1:'var(--P1)',P2:'var(--P2)',P3:'var(--P3)'};

const I={
  newTopic:T('New topic','新建事项'), settings:T('Settings','设置'), search:T('Search','搜索'),
  v_needs:T('Needs me','待我处理'), v_waiting:T('Waiting on others','等别人'), v_follow:T('Follow-up due','该跟进了'),
  v_all:T('All open','全部进行中'), v_done:T('Done','已完成'),
  toSort:T('To sort','待归类'), toSortHint:T('new, not in a topic yet','新进来、还没归到事项'),
  st_needs_me:T('Needs me','待我处理'), st_waiting:T('Waiting on others','等别人'), st_snoozed:T('Snoozed','暂缓'), st_done:T('Done','已完成'),
  urgency:T('Urgency','紧急程度'), status:T('Status','状态'), followUp:T('Follow up','跟进日期'), from:T('From','来自'),
  auto:T('Auto','自动'), manualUntil:T('Manual until','手动，有效到'), backAuto:T('back to auto','改回自动'),
  aiWould:T('AI would set','AI 认为应该是'),
  tabBrief:T('Brief','简报'), tabCtx:T('Context','Context'), tabTl:T('Timeline','时间线'),
  addSub:T('+ Add sub-topic','+ 添加子事项'),
  ask:T('Ask Claude about this topic…','就这个事项问 Claude…'), askBtn:T('Ask','提问'),
  askNote:T('Claude already has this brief and every item in Context.','Claude 已经读过这份简报和 Context 里的所有内容。'),
  draft:T('Draft reply (not sent)','回复草稿（不会自动发送）'),
  writing:T('Claude is writing the brief…','Claude 正在写简报…'),
  drop:T('Paste a link, drop a file, or write a note. Claude adds a summary.','粘贴链接、拖入文件或写一条笔记，Claude 会生成摘要。'),
  merge:T('Merge into…','合并到…'), split:T('Split…','拆分…'), moveUnder:T('Move under…','移到某个事项下面'), promote:T('Make top-level','移到顶层'),
  cancel:T('Cancel','取消'), ok:T('OK','确定'), create:T('Create','创建'),
  title:T('Title','标题'), source:T('Link, text, or file (optional)','链接、文字或文件（可选）'),
  parent:T('Parent topic','父事项'), none:T('None (top level)','无（顶层）'),
  mergeHint:T('This topic\'s context, timeline, and sub-topics move into the target. New messages from its threads go to the target.','这个事项的 context、时间线和子事项会移到目标事项。之后它的 thread 来的新消息也会进入目标事项。'),
  mergeTarget:T('Merge into','合并到'),
  splitPick:T('Move these out','把这些移出去'), splitTitle:T('New topic title','新事项标题'), splitAs:T('Create as','创建为'),
  asTop:T('Top-level topic','顶层事项'), asSub:T('Sub-topic of this topic','这个事项的子事项'),
  sortTitle:T('Sort','归类'), sortHint:T('Claude pre-filled a target for each part. Change any of them, then confirm.','Claude 为每一部分预先选了目标事项。可以随意修改，然后确认。'),
  newTopicOpt:T('New topic','新建事项'), ignore:T('Ignore','忽略'), confirm:T('Confirm','确认'),

function topicSend(t,text,voice){
  if(!text.trim()) return;
  t.chat.push({k:'u',s:'topic',w:'now',voice,text});
  let m;
  if((m=text.match(/^(?:add to timeline|加到时间线|添加到时间线)[:：]?\s*(.+)/i))){
    const e={w:'now',a:'me',x:T(m[1]+' (added via Claude tab)',m[1]+'（通过 Claude 标签页添加）')}; t.tl.push(e);
    t.chat.push({k:'a',s:'topic',x:T('Added to the timeline: “'+m[1]+'”','已加到时间线：“'+m[1]+'”'),undo:true,ref:e,refIn:'tl'});
  }else if((m=text.match(/^(?:add to context|加到 ?context|添加到 ?context)[:：]?\s*(.+)/i))){
    const e={ic:'NO',a:'me',t:T('Note','笔记'),s:T(m[1],m[1])}; t.ctx.push(e);
    t.chat.push({k:'a',s:'topic',x:T('Added a note to Context: “'+m[1]+'”','已在 Context 里加了一条笔记：“'+m[1]+'”'),undo:true,ref:e,refIn:'ctx'});
  }else if(/merge|split|status|合并|拆分|状态|紧急/i.test(text)){
    t.chat.push({k:'a',s:'topic',x:T('This changes the topic structure, so please confirm.','这会改变事项的结构，请先确认。'),confirm:T('Set status of this topic to “Waiting on others”','把这个事项的状态改为“等别人”')});
  }else{
    t.chat.push({k:'a',s:'topic',x:L2('mockTopic')});
  }
  render();
}

let jfilter='all';
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'k':String(n);
function renderActivity(){
  const done=jobs.filter(j=>j.cost!=null);
  const sum=k=>done.reduce((a,j)=>a+j[k],0);
  const topicName=id=>id&&get(id)?esc(tr(get(id).title)):'—';
  const types=['triage','topic','invest','meeting','knowledge','assistant'];
  const el=document.getElementById('activity');
  el.innerHTML=`<h2 style="margin-top:0">${L('ac_today')}</h2>
   <div class="tiles">
    <div class="tile"><div class="k">${L('ac_jobs')}</div><div class="v">${done.length}</div><div class="s">${jobs.length-done.length} ${L('st_running')}/${L('st_queued')}</div></div>
    <div class="tile"><div class="k">${L('ac_in')}</div><div class="v">${fmt(sum('i'))}</div></div>
    <div class="tile"><div class="k">${L('ac_out')}</div><div class="v">${fmt(sum('o'))}</div></div>
    <div class="tile"><div class="k">${L('ac_cache')}</div><div class="v">${fmt(sum('cr'))} / ${fmt(sum('cw'))}</div></div>
    <div class="tile"><div class="k">${L('ac_cost')}</div><div class="v">$${sum('cost').toFixed(2)}</div><div class="s">${L('ac_costNote')}</div></div>
   </div>

   <h2>${L('ac_jobsT')}</h2><div class="d">${L('ac_queueD')}</div>
   <div class="filters">${['all',...types].map(x=>`<button class="btn sm ${jfilter===x?'primary':''}" data-jf="${x}">${x==='all'?L('all'):L('ty_'+x)}</button>`).join('')}</div>
   <table><tr><th>${L('c_time')}</th><th>${L('c_type')}</th><th>${L('c_topic')}</th><th>${L('c_trigger')}</th><th>${L('c_model')}</th><th class="num">${L('c_dur')}</th><th class="num">${L('c_tok')}</th><th class="num">${L('c_cost')}</th><th>${L('c_status')}</th></tr>
   ${jobs.filter(j=>jfilter==='all'||j.type===jfilter).map(j=>`<tr><td>${j.t}</td><td>${L('ty_'+j.type)}</td><td>${topicName(j.topic)}</td><td>${esc(tr(j.trig))}</td><td>${j.model}</td>
     <td class="num">${j.dur||'—'}</td><td class="num">${j.i!=null?`${fmt(j.i)} / ${fmt(j.o)} / ${fmt(j.cr+j.cw)}`:'—'}</td><td class="num">${j.cost!=null?'$'+j.cost.toFixed(2):'—'}</td>
     <td>${j.st==='running'?`<span class="pill run">${L('st_running')}</span>`:j.st==='queued'?`<span class="pill">${L('st_queued')}</span>`:`<span class="pill">${L('st_ok')}</span>`}</td></tr>`).join('')}</table>

   <h2>${L('ac_sessions')}</h2><div class="d">${L('ac_sessionsD')}</div>
   <table><tr><th>${L('c_session')}</th><th>${L('c_type')}</th><th>${L('c_topic')}</th><th class="num">${L('ac_jobs')}</th><th class="num">Tokens</th><th class="num">${L('c_cost')}</th><th>${L('c_last')}</th><th></th></tr>
   ${sessions.map(s=>`<tr><td><code>${s.id}</code></td><td>${L('ty_'+s.type)}</td><td>${topicName(s.topic)}</td><td class="num">${s.jobs}</td><td class="num">${s.tok}</td><td class="num">$${s.cost.toFixed(2)}</td><td>${s.last}</td>
     <td style="white-space:nowrap"><button class="btn sm" data-tx="${s.id}">${L('viewT')}</button> <button class="btn sm" data-term="${s.id}">${L('openTerm')}</button></td></tr>`).join('')}</table>

   <h2>${L('ac_types')}</h2>
   <table><tr><th>${L('c_type')}</th><th>${L('c_purpose')}</th><th>${L('c_model')}</th><th>${L('c_life')}</th></tr>
   ${types.map(x=>`<tr><td>${L('ty_'+x)}</td><td>${L('tyd_'+x)}</td><td>${{triage:'Haiku',invest:'Opus'}[x]||'Sonnet'}</td><td>${L('tyl_'+x)}</td></tr>`).join('')}</table>`;
  el.querySelectorAll('[data-jf]').forEach(b=>b.onclick=()=>{jfilter=b.dataset.jf;renderActivity()});
  el.querySelectorAll('[data-term]').forEach(b=>b.onclick=()=>infoModal(L('openTerm'),`<div class="note">${L('termNote')}</div><pre class="jsonl">cd ~/ManagerOS && claude --resume ${b.dataset.term}…</pre>`));

        - on-call: hotfix ETA 40 min …
[tool]  get_topic(t1)  → brief v2, 5 artifacts
[tool]  read_artifact(#incident-4821) → 3 new messages
[asst]  Hotfix ETA does not change impact; keep P0. Add rollback option.
[tool]  set_auto_urgency(t1, P0, "hotfix ETA does not change impact")
[tool]  write_brief(t1, brief_en, brief_zh) → ok
[result] 38 s · in 2.1k · out 1.8k · cache read 61k · $0.21</pre>`));

function infoModal(title,html){
  const d=document.getElementById('dialog');
  d.innerHTML=`<h2>${title}</h2>${html}<div class="acts"><button class="btn" id="mCancel">${L('close')}</button></div>`;
  document.getElementById('modal').classList.add('show');
  document.getElementById('mCancel').onclick=()=>document.getElementById('modal').classList.remove('show');
}

/* ---------- Pages ---------- */
let page='topics';
function showPage(p){
  page=p;
  document.getElementById('main').style.display=p==='topics'?'':'none';
  document.getElementById('settings').style.display=p==='settings'?'block':'none';
  document.getElementById('activity').style.display=p==='activity'?'block':'none';
  document.getElementById('knowledge').style.display=p==='knowledge'?'':'none';
  document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===p));
  refresh();
}
function refresh(){
  renderStatic();
  if(page==='topics') render(); else if(page==='settings') renderSettings(); else if(page==='activity') renderActivity(); else renderKnowledge();
  if(document.getElementById('drawer').classList.contains('show')) renderDrawer();
}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
document.getElementById('setBtn').onclick=()=>showPage(page==='settings'?'topics':'settings');
document.getElementById('view').onchange=e=>{state.view=e.target.value;render()};
document.getElementById('q').oninput=e=>{state.q=e.target.value;renderList()};
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{
  lang=b.dataset.lang;
  document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('on',x===b));
  refresh();
});
render();
